spring.cloud.gateway.discovery.locator.enabled=false

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO

resilience4j.circuitbreaker.instances.carService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.carService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.carService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.carService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.carService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.carService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.carService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2

spring.cloud.gateway.routes[0].id=car-service
spring.cloud.gateway.routes[0].uri=lb://CAR-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/car-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=carService
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/car

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=userService
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/user