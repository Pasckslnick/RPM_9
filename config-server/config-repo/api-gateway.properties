resilience4j.circuitbreaker.instances.newsService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.newsService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.newsService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.newsService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.newsService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.newsService.waitDurationInOpenState=10s
