spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5500,http://127.0.0.1:5500
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO

resilience4j.circuitbreaker.instances.carService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.carService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.carService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.carService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.carService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.carService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.carService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2

spring.cloud.gateway.routes[0].id=car-service
spring.cloud.gateway.routes[0].uri=lb://CAR-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/car-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=carService
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/car

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=userService
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/user

spring.cloud.gateway.routes[2].id=test-drives-service
spring.cloud.gateway.routes[2].uri=lb://TEST-DRIVES-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/test-drive-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[1].args.name=testDrivesService
spring.cloud.gateway.routes[2].filters[1].args.fallbackUri=forward:/fallback/test-drive

spring.cloud.gateway.routes[3].id=config-server
spring.cloud.gateway.routes[3].uri=http://localhost:8888
spring.cloud.gateway.routes[3].predicates[0]=Path=/config-server/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=news-service
spring.cloud.gateway.routes[4].uri=lb://NEWS-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/news-service/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[4].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[1].args.name=newsService
spring.cloud.gateway.routes[4].filters[1].args.fallbackUri=forward:/fallback/news

resilience4j.circuitbreaker.instances.testDrivesService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.testDrivesService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.testDrivesService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.testDrivesService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.testDrivesService.failureRateThreshold=50
