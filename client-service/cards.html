<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEEKR · Корзины</title>
    <link rel="stylesheet" href="/css/zeekr.css">
</head>
<body>

<div class="menu">
    <img src="/images/logotipe.png" alt="ZEEKR">
    <nav class="razdelu">
        <a href="/cars.html">Модели</a>
        <a href="/dealers.html">Дилеры</a>
        <a href="/index.html">Главная</a>

        <a href="/test_drives.html">Тест-драйвы</a>
        <a href="/cards.html">Корзины</a>
        <a href="/profile.html">Профиль</a>
    </nav>
</div>

<div class="page">
    <h1>Корз<span>ины</span></h1>
    <p class="subtitle">Cart list</p>

    <div class="toolbar">
        <div class="group">
            <input type="text" id="searchInput" placeholder="Поиск по статусу..." style="width:280px; margin:0">
            <button id="searchBtn" class="ghost">Найти</button>
            <button id="clearSearchBtn" class="ghost">Сбросить</button>
        </div>
        <button id="addBtn" class="primary" style="display:none;">+ Добавить корзину</button>
    </div>

    <table id="cardsTable">
        <thead>
        <tr>
            <th style="width:60px;">ID</th>
            <th>Пользователь</th>
            <th>Дата</th>
            <th>Статус</th>
            <th>Позиций</th>
            <th style="width:300px;">Действия</th>
        </tr>
        </thead>
        <tbody id="cardsBody"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/cards.js"></script>
</body>
</html>
