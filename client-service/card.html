<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEEKR · Корзина</title>
    <link rel="stylesheet" href="/css/zeekr.css">
</head>
<body>

<div class="menu">
    <img src="/images/logotipe.png" alt="ZEEKR">
    <nav class="razdelu">
        <a href="/cards.html">← К корзинам</a>
        <a href="/cars.html">Модели</a>
        <a href="/index.html">Главная</a>

        <a href="/profile.html">Профиль</a>
        <button id="logoutBtn" class="ghost" style="margin-left:20px; padding:10px 20px">Выйти</button>
    </nav>
</div>

<div class="page">
    <h1 id="cardTitle">Корзина</h1>
    <p class="subtitle" id="cardMeta"></p>

    <div class="toolbar">
        <div class="group">
            <button id="addItemBtn" class="primary" style="display:none;">+ Добавить комплектацию</button>
            <button id="orderBtn" class="primary" >Оформать заказ</button>

        </div>
        <div style="margin-left:auto;font-size:20px;color:#fff;">
            Итого: <span id="totalPrice">0</span> ₽
        </div>
    </div>

    <table id="itemsTable">
        <thead>
        <tr>
            <th style="width:60px;">ID</th>
            <th>Модель</th>
            <th>Комплектация</th>
            <th>Цена</th>
            <th>Кол-во</th>
            <th>Сумма</th>
            <th style="width:260px;">Действия</th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
    </table>
</div>

<div id="itemModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="itemModalTitle">Добавить комплектацию</h2>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <input type="hidden" id="itemCardId">

            <label>Комплектация
                <select id="itemComplecttion" required>
                    <option value="">— выберите комплектацию —</option>
                </select>
            </label>

            <label>Количество
                <input type="number" id="itemQuantity" min="1" value="1" required>
            </label>

            <label>Цена, ₽
                <input type="number" id="itemPrice" step="0.01" min="0.01" required>
            </label>


            <div class="modal-actions">
                <button type="button" id="itemCancelBtn" class="ghost">Отмена</button>
                <button type="submit" class="primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/card.js"></script>
</body>
</html>
