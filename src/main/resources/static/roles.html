<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEEKR · Роли</title>
    <link rel="stylesheet" href="/css/zeekr.css">
</head>
<body>

<div class="menu">
    <img src="/images/logotipe.png" alt="ZEEKR">
    <nav class="razdelu">
        <a href="/profile.html">Профиль</a>
    </nav>
</div>

<div class="page">
    <h1>Роли<span> пользователей</span></h1>
    <p class="subtitle">User roles</p>

    <div class="toolbar">
        <div class="group">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." style="width:280px; margin:0">
            <button id="searchBtn" class="ghost">Найти</button>
            <button id="clearSearchBtn" class="ghost">Сбросить</button>
        </div>
        <button id="addBtn" class="primary">+ Добавить</button>
    </div>

    <table id="rolesTable">
        <thead>
        <tr>
            <th style="width:80px;">ID</th>
            <th>Название роли</th>
            <th style="width:300px;">Действия</th>
        </tr>
        </thead>
        <tbody id="rolesBody"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>
</div>

<!-- Модальное окно формы -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h2 id="modalTitle">Добавить роль</h2>
        <form id="roleForm">
            <input type="hidden" id="itemId">
            <label>Название роли
                <input type="text" id="itemName" required minlength="2" maxlength="100">
            </label>
            <div class="modal-actions">
                <button type="button" id="cancelBtn" class="ghost">Отмена</button>
                <button type="submit" class="primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно просмотра -->
<div id="viewModal" class="modal hidden">
    <div class="modal-content">
        <h2>Просмотр роли</h2>
        <dl id="viewContent"></dl>
        <div class="modal-actions">
            <button type="button" id="closeViewBtn" class="ghost">Закрыть</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/roles.js"></script>
</body>
</html>
