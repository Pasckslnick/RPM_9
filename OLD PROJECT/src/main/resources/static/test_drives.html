<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEEKR · Тест-драйвы</title>
  <link rel="stylesheet" href="/css/zeekr.css">
</head>
<body>

<div class="menu">
  <img src="/images/logotipe.png" alt="ZEEKR">
  <nav class="razdelu">
    <a href="/index.html">Главная</a>

    <a href="/dealers.html">Дилеры</a>
    <a href="/news.html">Новости</a>
    <a href="/cars.html">Модели</a>
    <a href="/cards.html">Корзины</a>
    <a href="/profile.html">Профиль</a>
  </nav>
</div>

<div class="page">
  <h1>Тест<span>-драйвы</span></h1>
  <p class="subtitle">Test drives</p>

  <div class="toolbar">
    <div class="group">
      <input type="text" id="searchInput" placeholder="Поиск по статусу или комментарию..." style="width:340px; margin:0">
      <button id="searchBtn" class="ghost">Найти</button>
      <button id="clearSearchBtn" class="ghost">Сбросить</button>
    </div>
    <button id="bookBtn" class="primary" style="display:none;">Записаться на тест-драйв</button>
  </div>

  <table id="testDrivesTable">
    <thead>
    <tr>
      <th style="width:60px;">ID</th>
      <th>Клиент</th>
      <th>Модель</th>
      <th>Дилер</th>
      <th>Дата</th>
      <th>Статус</th>
      <th>Комментарий</th>
      <th style="width:300px;">Действия</th>
    </tr>
    </thead>
    <tbody id="testDrivesBody"></tbody>
  </table>

  <div id="pagination" class="pagination"></div>
</div>

<!-- Модальное окно формы -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Добавить тест-драйв</h2>
    <form id="testDriveForm">
      <input type="hidden" id="itemId">

      <label>Клиент
        <select id="itemUser" required>
          <option value="">— выберите клиента —</option>
        </select>
      </label>

      <label>Модель
        <select id="itemCarModel" required>
          <option value="">— выберите модель —</option>
        </select>
      </label>

      <label>Дилер
        <select id="itemDealer" required>
          <option value="">— выберите дилера —</option>
        </select>
      </label>

      <label>Дата тест-драйва
        <input type="date" id="itemDate" required>
      </label>

      <label>Статус
        <input type="text" id="itemStatus" required minlength="2" maxlength="100"
               placeholder="Новая">
      </label>

      <label>Комментарий
        <textarea id="itemComment" required minlength="3" maxlength="255"></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="ghost">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальное окно просмотра -->
<div id="viewModal" class="modal hidden">
  <div class="modal-content">
    <h2>Просмотр тест-драйва</h2>
    <dl id="viewContent"></dl>
    <div class="modal-actions">
      <button type="button" id="closeViewBtn" class="ghost">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/test_drives.js"></script>
</body>
</html>
