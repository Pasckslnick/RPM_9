<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEEKR · Дилеры</title>
    <link rel="stylesheet" href="/css/zeekr.css">
</head>
<body>

<div class="menu">
    <img src="/images/logotipe.png" alt="ZEEKR">
    <nav class="razdelu">
        <a href="/index.html">Главная</a>

        <a href="/cars.html">Модели</a>
        <a href="/news.html">Новости</a>
        <a href="/test_drives.html">Тест-драйвы</a>
        <a href="/cards.html">Корзины</a>
        <a href="/profile.html">Профиль</a>
    </nav>
</div>

<div class="page">
    <h1>Дилеры<span> ZEEKR</span></h1>
    <p class="subtitle">Official dealerships</p>

    <div class="toolbar">
        <div class="group">
            <input type="text" id="searchInput" placeholder="Поиск по названию или городу..." style="width:320px; margin:0">
            <button id="searchBtn" class="ghost">Найти</button>
            <button id="clearSearchBtn" class="ghost">Сбросить</button>
        </div>
        <button id="addBtn" class="primary">+ Добавить</button>
    </div>

    <table id="dealersTable">
        <thead>
        <tr>
            <th style="width:60px;">ID</th>
            <th>Название</th>
            <th>Город</th>
            <th>Адрес</th>
            <th>Телефон</th>
            <th>Email</th>
            <th>Часы работы</th>
            <th style="width:300px;">Действия</th>
        </tr>
        </thead>
        <tbody id="dealersBody"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>
</div>

<!-- Модальное окно формы -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h2 id="modalTitle">Добавить дилера</h2>
        <form id="dealerForm">
            <input type="hidden" id="itemId">

            <label>Название
                <input type="text" id="itemDealerName" required minlength="2" maxlength="120">
            </label>
            <label>Город
                <input type="text" id="itemCity" required minlength="2" maxlength="80">
            </label>
            <label>Адрес
                <input type="text" id="itemAddress" required minlength="5" maxlength="200">
            </label>
            <label>Телефон
                <input type="text" id="itemPhone" required pattern="^\+?[0-9]{10,15}$"
                       placeholder="89991234567">
            </label>
            <label>Email
                <input type="email" id="itemEmail" required maxlength="120">
            </label>
            <label>Часы работы
                <input type="text" id="itemWorkHours" required minlength="3" maxlength="100"
                       placeholder="09:00-18:00">
            </label>

            <div class="modal-actions">
                <button type="button" id="cancelBtn" class="ghost">Отмена</button>
                <button type="submit" class="primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно просмотра -->
<div id="viewModal" class="modal hidden">
    <div class="modal-content">
        <h2>Просмотр дилера</h2>
        <dl id="viewContent"></dl>
        <div class="modal-actions">
            <button type="button" id="closeViewBtn" class="ghost">Закрыть</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/dealers.js"></script>
</body>
</html>
